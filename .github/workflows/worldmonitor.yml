name: WorldMonitor Data Collection

on:
  schedule:
    # 每小时整点触发 (UTC 时间)
    # 北京时间 = UTC+8，所以 UTC 0:00 = 北京 8:00
    - cron: '0 * * * *'
  workflow_dispatch: # 允许手动触发
    inputs:
      test_alert:
        description: 'Force a test alert email (for verifying the email chain)'
        required: false
        default: 'false'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # 允许 bot push data.json commit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install asyncpg

      - name: Run intel engine (collect + store)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GDELT_DISABLED: '1'
        run: python intel_engine.py --store

      - name: Check for critical alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE_TEST_ALERT: ${{ inputs.test_alert }}
        run: python check_alerts.py

      - name: Send alert email
        if: ${{ success() && vars.ENABLE_ALERTS == 'true' }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ vars.ALERT_TO }}
        run: |
          if [ -f /tmp/alerts_to_send.txt ] && [ -s /tmp/alerts_to_send.txt ]; then
            python - <<'PYEOF' || echo "⚠️ email send failed, will retry next run"
          import os, smtplib, ssl
          from email.mime.text import MIMEText
          from email.header import Header

          smtp_user = os.environ["SMTP_USER"]
          smtp_pass = os.environ["SMTP_PASS"]
          to_addr = os.environ.get("ALERT_TO") or smtp_user

          with open("/tmp/alerts_to_send.txt", encoding="utf-8") as f:
              body = f.read()

          msg = MIMEText(body, "plain", "utf-8")
          msg["Subject"] = Header("🔴 WorldMonitor 异常告警", "utf-8")
          msg["From"] = smtp_user
          msg["To"] = to_addr

          ctx = ssl.create_default_context()
          with smtplib.SMTP_SSL("smtp.qq.com", 465, context=ctx, timeout=30) as server:
              server.login(smtp_user, smtp_pass)
              server.sendmail(smtp_user, [to_addr], msg.as_string())
          print(f"✅ Alert email sent to {to_addr}")
          PYEOF
          else
            echo "No critical alerts, skipping email"
          fi

      - name: Regenerate static dashboard data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python dashboard/generate_static.py

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/static/data.json
          git diff --staged --quiet || git commit -m "chore: auto-update dashboard data.json [skip ci]"
          git push
